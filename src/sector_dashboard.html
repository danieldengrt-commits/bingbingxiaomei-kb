function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return;
  const results = SECTOR_DB.filter(s =>
    s.name.includes(kw) || s.code.includes(kw.toUpperCase())
  ).slice(0, 15);
  renderSearchResults(results);
}

function renderSearchResults(results) {
  const container = document.getElementById('searchResults');
  if (results.length === 0) {
    container.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--t3);font-family:JetBrains Mono,monospace">未找到匹配板块</div>';
    container.classList.add('show');
    return;
  }
  const tracked = new Set(userSectors.map(s => s.code));
  container.innerHTML = results.map(r => {
    const isTracked = tracked.has(r.code);
    return `<div class="sr-item">
      <div>
        <span class="sr-name">${r.name}</span>
        <span class="sr-meta">${r.code} · ${r.source}</span>
      </div>

        : `<button class="sr-add" onclick="addSector('${r.code}','${r.name}','${r.type}')">+ 添加</button>`
      }
    </div>`;
  }).join('');
  container.classList.add('show');
}

// 格式化大数字
// tushare vol 单位是手，amount 单位是千元
function fmtNum(val, unit) {
  if (!val || val === 0) return '—';
  if (unit === 'vol') {
    // 手 → 亿手
    if (val >= 100000000) return (val / 100000000).toFixed(1) + '亿手';
    // 手 → 万手
    if (val >= 10000) return (val / 10000).toFixed(0) + '万手';
    return val.toFixed(0) + '手';
  }
  if (unit === 'amt') {
    // 千元 → 亿元（千元 / 100000 = 亿）
    if (val >= 100000) return (val / 100000).toFixed(0) + '亿';
    // 千元 → 万元
    return (val / 10).toFixed(0) + '万';
  }
  return val;
}

let ALL_DATA = null;

async function loadData() {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', '../data/sector_tracking.json', true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        try {
          const json = JSON.parse(xhr.responseText);
          const weekKey = Object.keys(json).sort().pop();
          ALL_DATA = json[weekKey].results;
          document.getElementById('week-label').textContent = `WEEK :: ${weekKey}`;
          resolve();
          return;
        } catch(e) {}
      }
      if (xhr.readyState === 4) {
        ALL_DATA = DEMO_DATA;
        document.getElementById('week-label').textContent = 'WEEK :: 2026-W18';
        resolve();
      }
    };
    xhr.send();
  });
}

function renderAll() {
  if (!ALL_DATA) return;
  const dataMap = {};
  ALL_DATA.forEach(d => { dataMap[d.ts_code] = d; });

  const sectors = userSectors.map(s => {
    const d = dataMap[s.code];
    if (d) return d;
    return {
      ts_code: s.code, name: s.name, type: s.type, category: s.category || "自定义",
      sentiment: [], heat: 3, heat_name: "常温",
      weekly_change: 0, amount_change_pct: 0,
      consecutive_up: 0, consecutive_down: 0, volatility: 0,
      volume: 0, amount: 0, no_data: true
    };
  });

  sectors.sort((a, b) => (b.heat - a.heat) || (b.weekly_change - a.weekly_change));

  document.getElementById('sector-count').textContent = `${sectors.length} SECTORS`;

  document.getElementById('dataTable').innerHTML = sectors.map(d => {
    const consec = d.consecutive_up > 0 ? d.consecutive_up : -d.consecutive_down;
    const consecStr = consec > 0 ? `+${consec}` : `${consec}`;
    let sentimentHtml = '—';
    if (d.sentiment_stocks && d.sentiment_stocks.length > 0) {
      sentimentHtml = d.sentiment_stocks.map(s => {
        const cls = s.change_5d >= 0 ? 'up' : 'dn';
        const sign = s.change_5d >= 0 ? '+' : '';
        return `<span class="${cls}">${s.name}${sign}${s.change_5d.toFixed(2)}%</span>`;
      }).join(' ');
    } else if (d.sentiment && d.sentiment.length > 0) {
      sentimentHtml = d.sentiment.join(' ');
    }
    return `<tr>
      <td style="font-weight:600">${d.name}</td>
      <td style="color:var(--t3)">${d.category||'—'}</td>
      <td class="r ${d.weekly_change>=0?'up':'dn'}">${d.weekly_change>=0?'+':''}${d.weekly_change.toFixed(2)}%</td>
      <td class="r ${d.amount_change_pct>=0?'up':'dn'}">${d.amount_change_pct>=0?'+':''}${d.amount_change_pct.toFixed(1)}%</td>
      <td class="r">${fmtNum(d.volume,'vol')}</td>
      <td class="r">${fmtNum(d.amount,'amt')}</td>
      <td class="r ${consec>0?'up':consec<0?'dn':''}">${consecStr}</td>
      <td class="r">${d.volatility.toFixed(1)}%</td>
      <td class="r"><span class="${HEAT_CSS[d.heat]}">[${d.heat}]${d.heat_name}</span></td>
      <td style="font-size:11px">${sentimentHtml}</td>
      <td><div class="remove-btn" onclick="removeSector('${d.ts_code}')" title="移除">×</div></td>
    </tr>`;
  }).join('');
}

loadData().then(() => renderAll());
</script>
