# 冰冰小美知识库 Nginx 配置
# 用法: 将此文件放到 /etc/nginx/sites-available/bbxmkb
#       然后 sudo ln -s /etc/nginx/sites-available/bbxmkb /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 域名解析: 在 DNS 将 bbxmkb.cn 和 www.bbxmkb.cn A 记录指向服务器 IP

# HTTP → HTTPS 自动跳转
server {
    listen 80;
    server_name bbxmkb.cn www.bbxmkb.cn;

    # 兼容 certbot 的 acme-challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点
server {
    listen 443 ssl;
    server_name bbxmkb.cn www.bbxmkb.cn;

    ssl_certificate /etc/letsencrypt/live/bbxmkb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbxmkb.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 所有请求代理到 Flask
    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（AI 流式回答）
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 静态文件直接由 Nginx 提供（性能更好）
    location /static/ {
        alias /opt/bingbingxiaomei-kb/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
